name: Probe site URL (temporary)
on: workflow_dispatch
permissions: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          h=$(curl --silent --max-time 20 --head "https://invertedcrayon-pranjals-projects-16d3b4ec.vercel.app/api/health" | tr -d '\r' | grep -i -E '^(HTTP|location|set-cookie|server|x-vercel)' | cut -c1-200 | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::notice title=Probe results::${h}"
          g=$(curl --silent --max-time 20 --head "https://invertedcrayon.com/" | tr -d '\r' | head -8 | cut -c1-160 | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::notice title=invertedcrayon.com::${g}"
